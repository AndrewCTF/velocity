# CI gate — mirrors CLAUDE.md's commit-boundary requirements:
# `pnpm -r typecheck` green, api pytest green (≥25), plus lint on both stacks.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Weekly re-run: new CVEs land in unchanged images and lockfiles.
  schedule:
    - cron: '17 6 * * 1'
  # publish.yml calls this before pushing images: a tag push is not a master
  # push, so without the call a release would skip every unit gate.
  workflow_call:

# Least-privilege token: this workflow only builds, tests, and lints — it never
# writes to the repo. Pin contents:read so a compromised transitive dependency
# executing during install cannot use GITHUB_TOKEN against the repo.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r lint

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      # `uv lock --check` currently fails here (uv.lock is drifted from
      # pyproject.toml — see the report for this wave). `--locked` fails LOUD
      # on that instead of `--frozen` silently installing the stale set, which
      # is the point of switching off pip: this must go red until the lock is
      # regenerated, not ship an image quietly missing dependencies.
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
      - name: Audit Python dependencies
        working-directory: apps/api
        # --locked, not --frozen: an out-of-date lock must fail this step, not
        # silently audit a dependency set that isn't what actually ships.
        run: |
          uv export --locked --no-hashes --no-emit-project > req.txt
          uvx pip-audit -r req.txt --no-deps --disable-pip
      - name: Audit feeder sidecar dependencies
        run: |
          for d in tools/*/; do
            [ -f "$d/package-lock.json" ] || continue
            (cd "$d" && npm audit --audit-level=high)
          done
      - name: Audit Rust dependencies
        # Fails on any advisory not ignored, with a reason, in
        # apps/desktop/src-tauri/.cargo/audit.toml.
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  images:
    # Build every shipped image and fail on any HIGH/CRITICAL CVE that has a
    # fix available. Trivy runs from a digest-pinned image, not a marketplace
    # action, so no third-party action code gets the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: |
          docker build -t velocity-api:ci -f infra/docker/api.Dockerfile .
          docker build -t velocity-web:ci -f infra/docker/web.Dockerfile .
          docker build -t velocity-nginx:ci -f infra/docker/nginx.Dockerfile .
      - name: Scan images
        run: |
          for img in velocity-api:ci velocity-web:ci velocity-nginx:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --quiet --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$img"
          done
      - name: Software bill of materials
        run: |
          mkdir -p sbom
          for img in velocity-api:ci velocity-web:ci velocity-nginx:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357 \
              "$img" -o spdx-json > "sbom/${img%%:*}.spdx.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
