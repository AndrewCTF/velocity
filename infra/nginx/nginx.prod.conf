# nginx reverse proxy (production) — serves the pre-built static web bundle and
# proxies API/WS/tile traffic to the backend. The dev-server proxy in
# nginx.conf is replaced here by a static root + SPA fallback.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  # No nginx version in Server: or error pages.
  server_tokens off;

  # Access log WITHOUT the query string: WebSocket upgrades carry the session
  # token or API key as ?key= (browsers cannot set headers on the upgrade),
  # and $request would write it to disk. $uri is the path alone.
  log_format noquery '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log noquery;

  # Client address. The only way in is the loopback-published port, so every
  # connection arrives from the compose bridge gateway: either the host's TLS
  # reverse proxy (which sets X-Forwarded-For) or a process on the host itself.
  # Take the client from X-Forwarded-For only from that hop, then pass the API
  # exactly ONE address (below), never a caller-extendable chain; the API's
  # limiter keys on it.
  set_real_ip_from 172.28.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # The ADS-B snapshot is a multi-MB JSON body polled every second — gzip
  # cuts it ~10x. No-op when the api already sent Content-Encoding: gzip.
  # /mcp's streamable-HTTP session (SSE) must NOT be gzipped — buffering it
  # stalls the stream — but it never matches these types (event-stream/plain
  # JSON-RPC frames aren't in gzip_types), so no separate opt-out is needed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/geo+json text/plain text/css
             application/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-IP request cap on /api/. The globe polls several layers concurrently
  # (some on a 1s grid, bbox-gated layers also refetch on every pan/zoom —
  # apps/web/CLAUDE.md "Refresh / motion"), so this needs headroom above a
  # single steady poll rate: 20r/s sustained with a 40-request burst drained
  # with no artificial delay (nodelay) covers a multi-layer session and a pan
  # burst without throttling a legitimate single browser tab.
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

  # Request bodies: small by default, large only on the two upload routes
  # (evidence 200 MB, recon RECON_UPLOAD_MAX_BYTES = 4 GB, apps/api/app/config.py).
  # The app enforces its exact caps; this stops an oversized body from ever
  # being spooled to the api container's /tmp on every other route.
  client_max_body_size 32m;

  server {
    listen 80;
    server_name _;

    # Security headers. `always` so they're also sent on error responses
    # (4xx/5xx), not just 2xx. Fill-if-absent at the app layer
    # (SecurityHeadersMiddleware) means a stricter app-set header (e.g.
    # /api/evidence's CSP) still wins; these are the floor for everything
    # nginx serves directly (the static SPA bundle) or proxies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # frame-ancestors cannot be set from the bundle's <meta> CSP, so it is sent
    # here; the full policy ships in index.html (apps/web/csp.ts).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Browsers ignore HSTS over plain HTTP, so this is inert on a loopback-only
    # box and takes effect once the host TLS proxy serves the site over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large uploads: same proxying as /api/, bigger body ceiling.
    location = /api/evidence/upload {
      client_max_body_size 210m;
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/recon/jobs {
      client_max_body_size 4100m;
      proxy_request_buffering off;
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # API
    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Basemap tile proxy
    location /tiles/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # WebSockets — alerts, AIS bridge
    location /ws/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 86400s;
    }

    # Agent-facing MCP endpoint (streamable-HTTP / SSE, app/main.py ~802).
    # Same no-buffering + long-read shape as /ws/ above: proxy_buffering off
    # is what actually matters here (gzip already skips it, see the comment
    # on the gzip block), since a buffered response holds an SSE stream open
    # with nothing delivered until the buffer fills or the connection ends.
    location /mcp {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 86400s;
    }

    # Pre-built static web bundle (SPA). No dev server: serve files, and fall
    # back to index.html so client-side routes resolve.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
