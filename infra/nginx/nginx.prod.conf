# nginx reverse proxy (production) — serves the pre-built static web bundle and
# proxies API/WS/tile traffic to the backend. The dev-server proxy in
# nginx.conf is replaced here by a static root + SPA fallback.

worker_processes auto;
# Runs as the unprivileged `nginx` user (docker-compose.prod.yml `user:`), on a
# read-only root filesystem: the pid file and every temp path live on the /tmp
# tmpfs instead of root-owned /var/run and /var/cache/nginx.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  # No nginx version in Server: or error pages.
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  # /tmp is a RAM-backed tmpfs capped in compose. Proxied responses (the
  # multi-MB ADS-B snapshot to a slow client) stream through the in-memory
  # buffers instead of spilling to a temp file that could fill it.
  proxy_max_temp_file_size 0;

  # Text the bundle serves directly (index.html, CSS, JS) declares its
  # encoding. text/html is always in the list; JSON needs no charset.
  charset utf-8;
  charset_types text/css application/javascript text/plain;

  # Access log WITHOUT the query string: WebSocket upgrades carry the session
  # token or API key as ?key= (browsers cannot set headers on the upgrade),
  # and $request would write it to disk. $uri is the path alone.
  log_format noquery '$remote_addr - [$time_iso8601] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log noquery;

  # Client address. The only way in is the loopback-published port, so every
  # connection arrives from the compose bridge gateway: either the host's TLS
  # reverse proxy (which sets X-Forwarded-For) or a process on the host itself.
  # Take the client from X-Forwarded-For only from that hop, then pass the API
  # exactly ONE address (below), never a caller-extendable chain; the API's
  # limiter keys on it.
  set_real_ip_from 172.28.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # The ADS-B snapshot is a multi-MB JSON body polled every second — gzip
  # cuts it ~10x. No-op when the api already sent Content-Encoding: gzip.
  # /mcp's streamable-HTTP session (SSE) must NOT be gzipped — buffering it
  # stalls the stream — but it never matches these types (event-stream/plain
  # JSON-RPC frames aren't in gzip_types), so no separate opt-out is needed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/geo+json text/plain text/css
             application/javascript image/svg+xml;

  # Resolve service names per request through Docker's embedded DNS, not once
  # at startup. A static `upstream { server api:8000; }` pins the IP nginx saw
  # when it booted: after `docker compose up -d api` (or a crash-restart)
  # recreates the container on a new address, nginx keeps sending to the old
  # one and answers 502, or reaches whichever container reused that IP.
  # A variable in proxy_pass forces the lookup; with no URI part the request
  # path is passed unchanged, exactly as before.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-IP request cap on /api/. The globe polls several layers concurrently
  # (some on a 1s grid, bbox-gated layers also refetch on every pan/zoom —
  # apps/web/CLAUDE.md "Refresh / motion"), so this needs headroom above a
  # single steady poll rate: 20r/s sustained with a 40-request burst drained
  # with no artificial delay (nodelay) covers a multi-layer session and a pan
  # burst without throttling a legitimate single browser tab.
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

  # Basemap tiles get their own zone so a zoom burst never eats the API budget.
  # One zoom step or a fly-to requests a few hundred tiles at once. Cesium sends
  # at most 6 at a time per server (RequestScheduler default, not overridden
  # here), so the ceiling is 6 / per-tile latency: about 600 r/s on a warm disk
  # cache at ~10 ms a tile. 300r/s sustained with a 1200 burst lets a fly-to
  # through several zoom levels load unthrottled; a 429 tile paints blank, so
  # this errs generous and only stops a scraper walking the pyramid.
  limit_req_zone $binary_remote_addr zone=tiles_per_ip:10m rate=300r/s;
  # Concurrent requests per client in /ws/ and /tiles/ (the only locations that
  # count). A tab holds about six WebSockets (alerts, AIS, ADS-B, maps, collab)
  # plus up to six tiles in flight, so ~12; 128 covers ten tabs with room, and
  # a refused upgrade would only reconnect-loop, so again generous. It bounds
  # how many sockets one address can pin on the api.
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  # A refused request is the client's rate, not an outage: 429, not 503.
  limit_req_status 429;
  limit_conn_status 429;

  # Request bodies: small by default, large only on the two upload routes
  # (evidence 200 MB, recon RECON_UPLOAD_MAX_BYTES = 4 GB, apps/api/app/config.py).
  # The app enforces its exact caps; this stops an oversized body from ever
  # being spooled to the api container's /tmp on every other route.
  client_max_body_size 32m;

  server {
    # 8080, not 80: an unprivileged master cannot bind below 1024.
    listen 8080;
    server_name _;
    set $api_upstream api:8000;

    # Security headers. `always` so they're also sent on error responses
    # (4xx/5xx), not just 2xx. Fill-if-absent at the app layer
    # (SecurityHeadersMiddleware) means a stricter app-set header (e.g.
    # /api/evidence's CSP) still wins; these are the floor for everything
    # nginx serves directly (the static SPA bundle) or proxies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # frame-ancestors cannot be set from the bundle's <meta> CSP, so it is sent
    # here; the full allowlist ships in index.html (apps/web/csp.ts). The header
    # repeats the meta policy's object-src and base-uri so the response itself
    # carries them (ASVS 3.4.3). Both policies are enforced, and a directive
    # absent from this one restricts nothing, so script-src and connect-src stay
    # the meta policy's. No location below sets its own add_header: one would
    # drop every header in this block for that location.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    # Browsers ignore HSTS over plain HTTP, so this is inert on a loopback-only
    # box and takes effect once the host TLS proxy serves the site over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Every proxied location clears X-Velocity-Tier. The api believes that
    # header from a trusted peer (apps/api/app/tier.py) and nginx is one, so a
    # client's own copy must never pass through. proxy_set_header does not
    # inherit into a location that sets any of its own, hence the repetition.

    # Large uploads: same proxying as /api/, bigger body ceiling.
    location = /api/evidence/upload {
      client_max_body_size 210m;
      # Stream to the api instead of spooling up to 210 MB on the /tmp tmpfs
      # (the root filesystem is read-only); the app enforces the exact cap.
      proxy_request_buffering off;
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
    }
    location = /api/recon/jobs {
      client_max_body_size 4100m;
      proxy_request_buffering off;
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
    }

    # API
    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
    }

    # A manual workflow run holds the request until the engine finishes, up to
    # WALL_BUDGET_S = 300 s (apps/api/app/workflows/engine.py). The 60 s default
    # read timeout answered 504 while the run kept going, and a retry started a
    # second run. 330 s outlives the budget; the host TLS proxy in front needs
    # an equal or longer timeout of its own.
    location /api/workflows/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
      proxy_read_timeout 330s;
    }

    # Basemap tile proxy
    location /tiles/ {
      limit_req zone=tiles_per_ip burst=1200 nodelay;
      limit_conn conn_per_ip 128;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
    }

    # WebSockets — alerts, AIS bridge
    location /ws/ {
      limit_conn conn_per_ip 128;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
      proxy_read_timeout 86400s;
    }

    # Agent-facing MCP endpoint (streamable-HTTP / SSE, app/main.py ~802).
    # Same no-buffering + long-read shape as /ws/ above: proxy_buffering off
    # is what actually matters here (gzip already skips it, see the comment
    # on the gzip block), since a buffered response holds an SSE stream open
    # with nothing delivered until the buffer fills or the connection ends.
    location /mcp {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Velocity-Tier "";
      proxy_buffering off;
      proxy_read_timeout 86400s;
    }

    # Pre-built static web bundle (SPA). No dev server: serve files, and fall
    # back to index.html so client-side routes resolve.
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      # vite builds with sourcemap 'hidden' (apps/web/vite.config.ts), which
      # keeps .map files in dist for local symbolication; they are a debugging
      # artifact and are not served. Nested here so it applies only to the
      # static root, never to a proxied /api/ path.
      location ~* \.map$ {
        return 404;
      }
    }
  }
}
