# nginx reverse proxy — single published port; key-hiding tile proxies later
# attach as new location blocks.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # The ADS-B snapshot is a multi-MB JSON body polled every second — gzip
  # cuts it ~10x. No-op when the api already sent Content-Encoding: gzip.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/geo+json text/plain text/css
             application/javascript image/svg+xml;

  # Resolve service names per request through Docker's embedded DNS, not once
  # at startup. A static `upstream { server api:8000; }` pins the IP nginx saw
  # when it booted: after `docker compose up -d api` (or a crash-restart)
  # recreates the container on a new address, nginx keeps sending to the old
  # one and answers 502, or reaches whichever container reused that IP.
  # A variable in proxy_pass forces the lookup; with no URI part the request
  # path is passed unchanged, exactly as before.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }



  server {
    listen 80;
    server_name _;
    set $api_upstream api:8000;
    set $web_upstream web:5173;

    # API
    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Basemap tile proxy
    location /tiles/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Cache-Control "public, max-age=86400";
    }

    # WebSockets — alerts, AIS bridge
    location /ws/ {
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 86400s;
    }

    # Vite dev server (HMR uses ws too)
    location / {
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
