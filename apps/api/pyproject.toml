[project]
name = "osint-api"
version = "1.0.1"
description = "OSINT geospatial console — FastAPI backend"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
# NOTE: Postgres/Timescale + Redis are Phase 2 (the observation store
# migrates to a hypertable per plan §locked-decisions #5). Their client libs
# (sqlalchemy/asyncpg/redis/apscheduler) were removed from Phase 1 deps
# because nothing imports them — re-add alongside the actual integration.
# orjson is NOT used as ORJSONResponse (FastAPI serializes annotated returns
# via pydantic-core and deprecates it); it is used directly in routes/adsb.py
# `_build_hot_blob` to serialize the ~14k-feature world blob every ~1s ~9x
# faster than stdlib json. The import there is optional with a json fallback.
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "orjson>=3.10",
  # isal (ISA-L) gzip for the world blob — see routes/adsb.py `_gzip_blob`.
  # Optional import there falls back to stdlib gzip if the wheel is absent.
  "isal>=1.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx[socks]>=0.27.2",
  "websockets>=13.0",
  "pillow>=10.0",
  "python-pptx>=0.6.23",
  "numpy>=1.26",
  "pyyaml>=6.0",
  # Upper bound is load-bearing, not tidiness. CI installs with
  # `pip install -e ".[dev]"`, which ignores uv.lock and resolves the newest
  # match, so an unbounded ">=1.2.0" silently adopted mcp 2.0.0 the day it was
  # published (2026-07-29). 2.x moved `mcp.server.fastmcp`, which app/mcp_server.py
  # imports at module scope, and app/main.py imports THAT at module scope, so the
  # whole test suite died at conftest with ModuleNotFoundError. It was not a code
  # change that broke it and no commit could be blamed; master had the same
  # unbounded pin and would have failed on its next run.
  # Revisit deliberately: moving to 2.x means porting the FastMCP import and the
  # 50 tool registrations, not relaxing this line.
  "mcp>=1.2.0,<2",
  "pyais>=2.6.0",
  "feedparser>=6.0.11",
  "cryptography>=42.0",
  "pyjwt>=2.0",
  # Local model manager (app.localllm): HF Hub API for catalog metadata/size
  # preflight + snapshot_download for Unsloth GGUF pulls. Pure-Python, safe as
  # a hard dependency (unlike the GDAL/torch-class optional extras below).
  "huggingface_hub>=0.34.0",
  # COG tiler (Track B2): turns Cloud-Optimized GeoTIFFs into XYZ tiles. Pulls
  # rasterio/GDAL, which do NOT build on every platform — app.imagery.tiler
  # guards the import so the app still boots if this fails to install. Keep it
  # graceful; do not make any import path hard-depend on it.
  "titiler-core>=0.18",
]

[project.scripts]
osint-mcp = "app.mcp_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-xdist>=3.8.0",
  "httpx[socks]>=0.27.2",
  "ruff>=0.6.8",
  # Not a runtime dependency — see the `sql` extra below, which is what a
  # deployment installs. It is here so the SQL connection can be PROVEN in CI
  # rather than only configured: SQLAlchemy drives SQLite, so the whole path
  # (env var → engine → query → dataset → ontology) runs with no server.
  # Without this line tests/test_connections_sql.py skips and the documented
  # backend baseline shifts by four between machines.
  "sqlalchemy>=2.0",
  # Same reason, smaller claim: aiokafka proves the import guard's POSITIVE
  # branch and that an unreachable broker is recorded rather than fatal. The
  # Kafka WIRE path stays unproven — see apps/api/CLAUDE.md — because faking a
  # consumer-group handshake would test our misunderstanding of it.
  "aiokafka>=0.11",
]
# MAVLink bridge sidecar (app.mavlink_bridge). Optional: without it the bridge
# runs log-only (echoes planned commands, no vehicle uplink). Install with
# `pip install -e '.[mavlink]'` to command a real drone / SITL.
mavlink = [
  "pymavlink>=2.4.40",
]
# Foundry connections (app.foundry.connections). Each kind is optional and
# reports itself unavailable when its client is absent, so a keyless boot with
# neither installed still works — that is a product requirement, not a dev
# convenience, and a deployment that does not consume Kafka must not be made to
# install a Kafka client. MQTT needs nothing: app/mqtt_client.py speaks the
# wire protocol over the websockets dependency that is already here.
#   pip install -e '.[kafka]'   Kafka topic  → dataset
#   pip install -e '.[sql]'     SQL query    → dataset (plus a DBAPI driver for
#                               the database in question, e.g. psycopg[binary])
kafka = [
  "aiokafka>=0.11",
]
sql = [
  "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom IS a call in an argument default —
# Depends()/Query() are designed for exactly that position.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Manual MCP integration drivers run against a live backend (not unit tests):
# allow long assertion lines and the blocking urllib store-seed call.
"tests/mcp_*_check.py" = ["E501", "ASYNC210"]
# Tests favour long, readable assertion + fixture lines over hard wrapping.
"tests/*" = ["E501"]
# The feed registry is a table of literal source URLs (87 of them past the
# margin); wrapping URLs breaks grep-ability. The long lines ARE the data.
"app/news/feeds_register.py" = ["E501"]
# main.py imports the FastAPI app + routes AFTER the allocator (jemalloc/libc)
# setup block runs — that ordering is deliberate (scripts/run-api.sh + the memory
# guardrails depend on it), so module-level-import-not-at-top is expected here.
"app/main.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Parallel by default: the suite is a verification gate that runs at every commit
# boundary, and 2 minutes of it taxes every change. Measured 2026-07-28 on 32
# cores: 118.9 s serial -> 30.1 s with -n auto, identical 2006 passed + 2 skipped.
#
# --dist loadfile, NOT the default `load`, and that is load-bearing. Three pieces
# of module state are mutated directly rather than through monkeypatch, so they
# are not auto-reverted and the tests around them depend on running in file
# order: ais_sidecar._stale_since/_restarts (test_ais_sidecar_reuse.py),
# adsb_sidecar._proc/_reuse_pid (test_adsb_sidecar_supervise.py), and the
# module-level _TEST_TILE_DIR in conftest.py that the tile tests build up across
# calls. loadfile keeps every test from one file on one worker, so today's
# ordering guarantee is preserved exactly. Fix those globals before loosening it.
#
# Pass `-n auto --dist loadfile` to run in parallel ON A MACHINE WHERE YOU HAVE
# VERIFIED IT. It is NOT the default, and that is a deliberate reversal of the
# 2026-07-28 decision described above.
#
# Why it was reverted: `-n auto` takes the worker count from the core count, so
# `--dist loadfile` groups DIFFERENT files into the same worker process on
# different machines. loadfile preserves ordering WITHIN a file; it says nothing
# about which files share a process. The three module-state leaks named above are
# only hidden by per-process isolation, so the suite answers differently per
# machine. Measured 2026-07-29 on this branch:
#
#   -n0  serial, 32 cores    2108 passed              110 s
#   -n16 parallel, 32 cores  2108 passed               30 s
#   -n4  parallel (CI shape) 2105-2107 passed, 39 s, and a DIFFERENT 1-3
#        failures each run - test_intel_route, test_news_edition_route,
#        test_llm_obs - depending on which files landed together.
#
# CI runs on 4 cores, which is why the api job failed on a branch whose local
# suite was green, with no commit to blame. A gate that answers differently per
# machine is not a gate, and 80 seconds is the correct price for one that is.
# The speedup returns the moment those globals are fixed; the note above already
# says to fix them first, and that is still the right order of work.
addopts = ""

