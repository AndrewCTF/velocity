<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Velocity">
  <title>Velocity</title>
  <rect width="32" height="32" rx="7" fill="#0e1116"/>
  <!-- The V is a recorded track: open square = archived fix, solid square =
       the live one. Inset to 78% to clear the rounded tile corners; stroke
       widths are pre-compensated for that scale. -->
  <g transform="translate(16 16) scale(0.78) translate(-16 -16)">
    <g fill="none" stroke="#ecebe7">
      <path d="M7 11 16 25.5 25 11" stroke-width="3.5" stroke-linejoin="miter"/>
      <rect x="3.9" y="4.9" width="6.2" height="6.2" stroke-width="2.5"/>
    </g>
    <rect x="21.9" y="4.9" width="6.2" height="6.2" fill="#ecebe7"/>
  </g>
</svg>
